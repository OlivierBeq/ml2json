[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ml2json"
dynamic = ["version"]
description = "A safe, transparent way to share and deploy scikit-learn models."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Olivier J. M. Béquignon", email = "olivier.bequignon.maintainer@gmail.com" },
]
maintainers = [
    { name = "Olivier J. M. Béquignon", email = "olivier.bequignon.maintainer@gmail.com" },
]
keywords = [
    "scikit-learn",
    "serializing",
    "json",
    "reproducibility",
    "machine learning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "scikit-learn>=1.8.0",
    "scipy>=1.13.0",
    "joblib>=1.3.0",
    "numpy>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/OlivierBeq/ml2json"
Repository = "https://github.com/OlivierBeq/ml2json"
Issues = "https://github.com/OlivierBeq/ml2json/issues"

[project.optional-dependencies]
full = [
    "xgboost>=3.1.3",
    "lightgbm>=4.6.0",
    "catboost>=1.2",
    "hdbscan>=0.8.31",
    "pynndescent>=0.5.13",
    "umap-learn>=0.5.8",
    "kmodes>=0.5",
    "mlchemad>=1.5.2",
    "hnswlib>=0.5.1",
    "opentsne>=1.0.0",
    "imbalanced-learn>=0.14.2",
    "scikit-learn-extra>=0.2.0",
    "prince>=0.17.0",
]
testing = [
    "ml2json[full]",
    "pytest",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.setuptools.dynamic]
version = { attr = "ml2json.__version__" }

[tool.pytest.ini_options]
testpaths = ["test"]
